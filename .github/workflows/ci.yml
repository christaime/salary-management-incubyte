name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run backend tests
        run: ./gradlew test --no-daemon

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      # The cypress-io/github-action starts the Angular server, waits for it, and runs tests
      - name: Cypress E2E Tests
        uses: cypress-io/github-action@v6
        with:
         # The command to start your Angular app
         start: npx ng serve --port 4200
         # Wait for the app to be ready
         wait-on: 'http://localhost:4200'
         # Wait for 2 minutes for the server to start (Angular builds can take a bit)
         wait-on-timeout: 120
         # The command to run cypress
         command: npx cypress run --e2e
         # Upload screenshots and videos on failure
         publish-summary: true

      # 6. Upload Cypress artifacts (screenshots/videos) if tests fail
      - name: Upload Cypress Artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
         name: cypress-artifacts
         path: |
           cypress/screenshots
           cypress/videos
         retention-days: 7

      - name: Build frontend
        run: npm run build -- --configuration=production