<mat-button-toggle-group
  class="report-kind-toggle w-full"
  [value]="selected()"
  [disabled]="disabled()"
  hideSingleSelectionIndicator
  (change)="onSelectionChange($event.value)"
>
  @for (kind of kinds; track kind) {
  <mat-button-toggle [value]="kind" class="flex-1">
    {{ labels[kind] }}
  </mat-button-toggle>
  }
</mat-button-toggle-group>
