<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4" novalidate>

  <div class="flex flex-row flex-wrap items-center gap-3 w-full">
    <!-- Start period picker -->
    <app-payroll-period-picker
      formControlName="startPeriod"
      data-testid="start-period"
      class="w-full sm:w-102 shrink-0"
      label="Start payroll period"
      [required]="true"
      [yearRange]="startPickerYearRange()"
      (yearChange)="onStartYearChange($event)"
    />

    <!-- End period picker -->
    <app-payroll-period-picker
      formControlName="endPeriod"
      data-testid="end-period"
      class="w-full sm:w-102 shrink-0"
      label="End payroll period"
      [yearRange]="endPickerYearRange()"
      [selectedYear]="endPickerSelectedYear()"
      [initialFilter]="endPeriodFilter()"
    />

    <!-- Action buttons -->
    <div class="flex items-center gap-2 shrink-0 mt-5">
      <button data-testid="btn-generate" mat-flat-button color="primary" type="submit" [disabled]="!canSubmit()">
        @if (submitting()) { Generating… } @else { Generate }
      </button>

      <button data-testid="btn-reset" mat-stroked-button type="button" (click)="onReset()">Reset</button>

      <button data-testid="btn-customize" mat-stroked-button type="button" (click)="filterDrawer.open()">
        <mat-icon class="mr-1">tune</mat-icon>
        Customize
      </button>
    </div>
  </div>

</form>

<app-aggregate-report-filter-drawer
  #filterDrawer
  [form]="form"
  (applied)="formChange.emit()"
/>
