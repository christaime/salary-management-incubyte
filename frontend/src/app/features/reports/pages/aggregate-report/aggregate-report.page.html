<div class="max-w-[1800px] mx-auto flex flex-col gap-4 p-4 md:px-8">

  <!-- Header -->
  <header class="flex flex-col gap-1">
    <h1 data-testid="aggregate-report-title" class="text-xl font-semibold text-on-surface m-0">
      Payroll report
    </h1>
    <p class="text-sm text-black m-0">
      Choose a date range and a report.
    </p>
  </header>

  <!-- Blocker banner (HTTP errors, blockers) -->
  <app-blocker-banner
    [blockers]="blockers()"
    (dismiss)="dismissBanner()"
  />

  <!-- Form -->
  <section class="mb-4 mt-4">
    <app-aggregate-report-form
      [submitting]="isLoading()"
      (formChange)="onFormChange()"
      (submitForm)="onFormSubmit($event)"
      (cancel)="onFormReset()"
    />
  </section>

  <!-- Kind toggle -->
  <app-report-kind-toggle
    [selected]="selectedKind()"
    [disabled]="isLoading()"
    (kindChange)="onKindChange($event)"
  />

  <!-- Loading -->
  @if (isLoading()) {
  <div class="flex items-center gap-3 text-sm text-on-surface-variant" role="status">
    <mat-spinner diameter="24" />
    <span data-testid="aggregate-report-loading-text">Generating report…</span>
  </div>
  }

  <section aria-live="polite" class="flex flex-col gap-4">

    <!-- Warning banner (successful responses with warnings) -->
    <app-warning-banner [warnings]="warnings()" />

    <!-- Results -->
    @if (showResults() && reportResponse(); as response) {
    <app-aggregate-report-results [response]="response" />
    }
  </section>

</div>
