<div class="max-w-[1800px] mx-auto flex flex-col gap-4 p-4 md:px-8" data-testid="payroll-summary-editor-page">
  <header class="flex items-center justify-between gap-3">
    <div class="flex flex-col gap-1">
      <h1 data-testid="payroll-editor-title" class="text-xl font-semibold text-slate-900 m-0">
        {{ mode() === 'create' ? 'New payroll summary' : 'Edit payroll summary' }}
      </h1>
    </div>
    <button data-testid="payroll-editor-back" type="button" mat-stroked-button (click)="onBackToList()">
      Back to list
    </button>
  </header>

  @if (state() === 'loading') {
  <div data-testid="payroll-editor-loading" class="text-center py-16 text-slate-400 text-sm border border-dashed border-slate-200 rounded-xl">
    Loading payroll summary…
  </div>
  }

  @if (state() === 'error' && error()) {
  <div data-testid="payroll-editor-error" class="rounded-lg border border-red-200 bg-red-50 p-4 text-sm text-red-800">
    <span class="font-bold">Error:</span> {{ error() }}
  </div>
  }

  @if (state() === 'loaded') {
  <app-payroll-summary-editor-form
    [mode]="mode()"
    [summary]="summary()"
    [saving]="saving()"
    [serverErrors]="serverErrors()"
    (save)="onSave($event)"
    (cancel)="onCancel()"
  />
  }
</div>
