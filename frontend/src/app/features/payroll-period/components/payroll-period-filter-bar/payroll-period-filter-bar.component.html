<div
  data-testid="payroll-period-filter-bar"
  class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm"
  [formGroup]="form"
>
  <div
    class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-[minmax(0,2fr)_minmax(0,1fr)_minmax(0,1fr)_minmax(0,1fr)_minmax(0,1fr)_auto] gap-3 items-end"
  >
    <!-- Keyword -->
    <mat-form-field
      appearance="outline"
      class="w-full min-w-0"
      subscriptSizing="dynamic"
    >
      <mat-label>Search</mat-label>
      <input
        matInput
        data-testid="filter-keyword"
        formControlName="keyword"
        placeholder="Period name"
        (keydown.enter)="onSubmit()"
      />
    </mat-form-field>

    <!-- Frequency -->
    <mat-form-field
      appearance="outline"
      class="w-full"
      subscriptSizing="dynamic"
    >
      <mat-label>Frequency</mat-label>
      <mat-select data-testid="filter-frequency" formControlName="frequency">
        <mat-option [value]="null">All</mat-option>
        @for (f of frequencies; track f) {
        <mat-option [value]="f">{{ frequencyLabel(f) }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <!-- Status -->
    <mat-form-field
      appearance="outline"
      class="w-full"
      subscriptSizing="dynamic"
    >
      <mat-label>Status</mat-label>
      <mat-select data-testid="filter-status" formControlName="status">
        @for (o of statusOptions; track o.value) {
        <mat-option [value]="o.value">{{ o.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <!-- From — native input, mirrors employee-identity DOB -->
    <div class="flex flex-col gap-1">
      <label
        for="filter-start-date"
        class="text-[11px] font-mono uppercase tracking-wider text-slate-700 font-semibold"
      >
        From
      </label>
      <input
        id="filter-start-date"
        data-testid="filter-start-date"
        type="date"
        formControlName="startDate"
        class="h-9 px-3 bg-slate-50 rounded-md border border-slate-200 text-sm font-mono text-slate-900 focus:outline-none focus:bg-white focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400 transition"
      />
    </div>

    <!-- To — native input, mirrors employee-identity DOB -->
    <div class="flex flex-col gap-1">
      <label
        for="filter-end-date"
        class="text-[11px] font-mono uppercase tracking-wider text-slate-700 font-semibold"
      >
        To
      </label>
      <input
        id="filter-end-date"
        data-testid="filter-end-date"
        type="date"
        formControlName="endDate"
        class="h-9 px-3 bg-slate-50 rounded-md border border-slate-200 text-sm font-mono text-slate-900 focus:outline-none focus:bg-white focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400 transition"
      />
    </div>

    <!-- Actions — inline on xl, aligned right when wrapped -->
    <div class="flex items-center justify-end gap-2 shrink-0">
      <button
        data-testid="filter-reset"
        type="button"
        mat-stroked-button
        (click)="onReset()"
      >
        Clear
      </button>
      <button
        data-testid="filter-search"
        type="button"
        mat-flat-button
        color="primary"
        (click)="onSubmit()"
        [disabled]="!canSearch()"
      >
        Search
      </button>
    </div>
  </div>
</div>
