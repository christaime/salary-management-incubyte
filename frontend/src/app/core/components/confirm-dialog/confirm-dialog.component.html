<div
  data-testid="confirm-dialog"
  class="p-5 flex flex-col gap-4 max-w-md"
>
  <div class="flex items-start gap-3">
    <div
      class="shrink-0 w-10 h-10 rounded-full flex items-center justify-center"
      [class.bg-red-100]="danger"
      [class.text-red-600]="danger"
      [class.bg-blue-100]="!danger"
      [class.text-blue-600]="!danger"
    >
      <mat-icon class="!w-5 !h-5 !text-[20px]">
        {{ danger ? 'warning' : 'info' }}
      </mat-icon>
    </div>

    <div class="flex flex-col gap-1 min-w-0">
      <h2 data-testid="confirm-dialog-title" class="text-base font-semibold text-slate-900 m-0">
        {{ data.title }}
      </h2>
      <p data-testid="confirm-dialog-message" class="text-sm text-slate-600 m-0">
        {{ data.message }}
      </p>
    </div>
  </div>

  <div class="flex items-center justify-end gap-2 pt-1">
    <button
      type="button"
      data-testid="confirm-dialog-cancel"
      mat-stroked-button
      (click)="onCancel()"
    >
      {{ cancelLabel }}
    </button>
    <button
      type="button"
      data-testid="confirm-dialog-confirm"
      mat-flat-button
      [color]="danger ? 'warn' : 'primary'"
      (click)="onConfirm()"
    >
      {{ confirmLabel }}
    </button>
  </div>
</div>
