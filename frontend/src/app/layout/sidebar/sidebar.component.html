@if (sidebarService.isOpen()) {
<aside
  class="app-sidebar"
  data-testid="app-sidebar"
  [ngClass]="{ 'collapsed': sidebarService.isCollapsed() }"
>
  <div class="sidebar-header">
    @if (!sidebarService.isCollapsed()) {
    <span class="sidebar-title" data-testid="sidebar-title">Navigation</span>
    }
    <button
      class="btn-icon sidebar-toggle"
      data-testid="sidebar-collapse-button"
      (click)="sidebarService.toggleCollapse()"
      [title]="sidebarService.isCollapsed() ? 'Expand Sidebar' : 'Collapse Sidebar'"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        [style.transform]="sidebarService.isCollapsed() ? 'rotate(180deg)' : 'none'"
        style="transition: transform 0.2s;"
      >
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
  </div>

  <nav class="sidebar-nav">
    <a
      class="nav-item"
      data-testid="nav-dashboard"
      routerLink="/dashboard"
      routerLinkActive="active"
      title="Dashboard"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
      @if (!sidebarService.isCollapsed()) {
      <span class="nav-label">Dashboard</span>
      }
    </a>

    <a
      class="nav-item"
      data-testid="nav-aggregate"
      routerLink="/reports/aggregate"
      routerLinkActive="active"
      title="Payroll Aggregate"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 21H3V3"/>
        <path d="M7 14l3-3 4 4 5-6"/>
      </svg>
      @if (!sidebarService.isCollapsed()) {
      <span class="nav-label">Payroll Aggregate</span>
      }
    </a>

    <a
      class="nav-item"
      data-testid="nav-earnings-ranking"
      routerLink="/reports/earnings-ranking"
      routerLinkActive="active"
      title="Earnings Ranking"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 9H4.5a2.5 2.5 0 010-5H6"/>
        <path d="M18 9h1.5a2.5 2.5 0 000-5H18"/>
        <path d="M4 22h16"/>
        <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
        <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
        <path d="M18 2H6v7a6 6 0 0012 0V2z"/>
      </svg>
      @if (!sidebarService.isCollapsed()) {
      <span class="nav-label">Earnings Ranking</span>
      }
    </a>

    <a
      class="nav-item"
      data-testid="nav-settings"
      routerLink="/settings"
      routerLinkActive="active"
      title="Settings"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06-.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
      @if (!sidebarService.isCollapsed()) {
      <span class="nav-label">Settings</span>
      }
    </a>
  </nav>
</aside>
}
