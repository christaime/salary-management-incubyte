spring:
  application:
    name: salary-management

  datasource:
    url: ${DB_URL:jdbc:sqlite:./data/salary-management.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:1}

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}
        type:
          preferred_uuid_jdbc_type: VARCHAR # Tell Hibernate to store UUIDs as text (is coherent with the actual flyway migration sql scripts)
          #preferred_big_decimal_jdbc_type: VARCHAR

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration,${DB_SEED_DIR_PATH:classpath:db/seed}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_DETAILS:when-authorized}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.salary.management: ${LOG_LEVEL_APP:DEBUG}

context:
  initializer:
    classes: com.salary.management.infrastructure.database.SqliteDirectoryInitializer